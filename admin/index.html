<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manan Rent Car</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #000000; --gold: #d4af37; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-add { background: var(--gold); color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .vehicle-list { margin-top: 40px; }
        .vehicle-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .btn-delete { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .nav-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: var(--gold); font-weight: 600; }
    </style>
</head>
<body>

<div class="admin-container">
    <a href="../index.html" class="nav-back"><i class="fas fa-arrow-left"></i> Volver a la web principal</a>
    <h1>Panel de Control de Flota</h1>

    <div id="add-form">
        <div class="form-group">
            <label>Nombre del Vehículo</label>
            <input type="text" id="car-name" placeholder="Ej: Honda CRV 2024">
        </div>
        <div class="form-group">
            <label>Precio por día (USD)</label>
            <input type="number" id="car-price" placeholder="Ej: 85">
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <select id="car-category">
                <option value="SUV">SUV</option>
                <option value="Sedán">Sedán</option>
                <option value="Moto">Moto</option>
                <option value="Económico">Económico</option>
            </select>
        </div>
        <button class="btn-add" onclick="addVehicle()">AGREGAR A LA WEB</button>
    </div>

    <div class="vehicle-list">
        <h2>Vehículos Actuales</h2>
        <div id="list-container"></div>
    </div>
</div>

<script>
    let vehicles = JSON.parse(localStorage.getItem('manan_vehicles')) || [];

    function renderList() {
        const container = document.getElementById('list-container');
        container.innerHTML = vehicles.map((v, index) => `
            <div class="vehicle-item">
                <div>
                    <strong>${v.name}</strong> - $${v.price}/día (${v.category})
                </div>
                <button class="btn-delete" onclick="deleteVehicle(${index})">Eliminar</button>
            </div>
        `).join('');
    }

    function addVehicle() {
        const name = document.getElementById('car-name').value;
        const price = document.getElementById('car-price').value;
        const category = document.getElementById('car-category').value;

        if(!name || !price) return alert("Llena todos los campos");

        const newCar = {
            id: Date.now(),
            name,
            price: parseInt(price),
            category,
            features: ["Disponible ahora", "Mantenimiento al día"]
        };

        vehicles.push(newCar);
        saveAndRefresh();

        document.getElementById('car-name').value = '';
        document.getElementById('car-price').value = '';
    }

    function deleteVehicle(index) {
        if(confirm("¿Seguro que quieres eliminar este vehículo?")) {
            vehicles.splice(index, 1);
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('manan_vehicles', JSON.stringify(vehicles));
        renderList();
        alert("¡Datos guardados! Los cambios se verán en la web principal.");
    }

    renderList();
</script>

</body>
</html>
